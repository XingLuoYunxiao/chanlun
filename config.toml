# 缠论分析系统配置
# 端口固定 8888：被占用时启动失败并明确报错，不静默切换端口。

# 结构引擎处理的周期。day=日线, 30=30分钟, 5=5分钟
periods = ["day", "30", "5"]

# baostock 复权：1=后复权 2=前复权 3=不复权。系统内一律用前复权。
bs_adjust = "2"

[web]
host = "127.0.0.1"
port = 8888

[data]
root = "data"
# 日线数据源：baostock（前复权，逐只，全市场约 2 小时）或 tdx（通达信整包，不复权，约 1 分钟）。
# 切到 tdx 会改变落库口径，且此后无法再由库内数据反推除权因子 —— 先跑 factors 再切。
source = "baostock"
