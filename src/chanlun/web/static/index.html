<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>缠论 · 盘后结构复盘台</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-main">缠论</span>
    <span class="brand-sub">盘后结构复盘台</span>
  </div>

  <form class="query" id="query" autocomplete="off">
    <label class="field">
      <span class="field-label">代码</span>
      <input id="code" name="code" type="text" inputmode="numeric" placeholder="600000" value="600000"
             aria-label="股票代码">
    </label>
    <div class="periods" role="tablist" aria-label="级别">
      <button type="button" class="period is-on" role="tab" aria-selected="true" data-period="day">日线</button>
      <button type="button" class="period" role="tab" aria-selected="false" data-period="week">周线</button>
      <button type="button" class="period" role="tab" aria-selected="false" data-period="month">月线</button>
      <button type="button" class="period" role="tab" aria-selected="false" data-period="30">30分</button>
      <button type="button" class="period" role="tab" aria-selected="false" data-period="5">5分</button>
    </div>
    <label class="field field-narrow">
      <span class="field-label">根数</span>
      <input id="limit" name="limit" type="number" min="60" max="20000" step="20" value="1200" aria-label="显示K线根数">
    </label>
    <button type="submit" class="go">看结构</button>
  </form>

  <div class="stamp" id="stamp" aria-live="polite">尚未加载</div>
</header>

<p class="disclaimer" role="note">
  <strong>仅结构信号提示，不构成投资建议</strong>；结构为收盘后确认，非盘中实时。
  图上虚线 / 半透明的笔画与中枢是<em>尚未确认</em>的：它可能被下一根K线改写。
</p>

<div class="work">
  <nav class="rail" aria-label="图层开关">
    <button type="button" class="rail-tab is-on" data-layer="strokes"  aria-pressed="true"><span>笔</span></button>
    <button type="button" class="rail-tab is-on" data-layer="segments" aria-pressed="true"><span>线段</span></button>
    <button type="button" class="rail-tab is-on" data-layer="pivots"   aria-pressed="true"><span>中枢</span></button>
    <button type="button" class="rail-tab is-on" data-layer="signals"  aria-pressed="true"><span>买卖点</span></button>
    <button type="button" class="rail-tab is-on" data-layer="divergence" aria-pressed="true"><span>背驰</span><em class="rail-badge" id="divergence-badge"></em></button>
    <button type="button" class="rail-tab is-on" data-layer="margin"   aria-pressed="true" title="确认刻度：结构在哪一根K线上才可被看见"><span>确认刻度</span></button>
  </nav>

  <aside class="watch-rail" id="watchlist" aria-label="自选股">
    <div class="watch-head">
      <button type="button" class="watch-toggle" id="watch-toggle" aria-expanded="true"
              aria-controls="watchlist" title="收起自选股栏，把宽度让给K线">‹</button>
      <h2>自选股</h2>
      <span class="watch-count" id="watch-count">0</span>
    </div>

    <form class="watch-add" id="watch-add-form" autocomplete="off">
      <input id="watch-code" type="text" list="universe-options" placeholder="代码 / 名称"
             aria-label="加自选：代码或名称">
      <datalist id="universe-options"></datalist>
      <button type="submit" id="watch-add">加入</button>
    </form>
    <p class="watch-err" id="watch-add-error" role="alert" hidden></p>

    <div class="watch-rows" id="watch-rows">
      <div class="watch-empty">自选股是空的。把常看的票加进来，点一下就能看它的笔、线段、中枢和买卖点。</div>
    </div>

    <p class="watch-foot">默认是七个大盘指数；日线在本地，周线/月线由日线聚合。缺数据的票会标出来，↑↓ 调顺序。</p>
  </aside>

  <main class="stage">
    <div class="tools">
      <button type="button" class="adjust" id="adjust-btn"
              title="点击切换复权口径：前复权 → 后复权 → 不复权"
              aria-label="复权口径，点击切换">复权 · 前复权</button>
      <span class="adjust-note" id="adjust-note" hidden></span>
      <button type="button" class="adjust" id="mode-btn"
              title="点击切换买卖点口径：严格 → 非严格"
              aria-label="买卖点口径，点击切换">口径：严格</button>
      <div class="ma-toggles" id="ma-toggles" role="group" aria-label="均线开关">
        <span class="tools-label">均线</span>
        <label class="ma-toggle" data-period="5" title="MA5">
          <input type="checkbox" checked><i style="--c:#e8c46a"></i><span>MA5</span>
        </label>
        <label class="ma-toggle" data-period="10" title="MA10">
          <input type="checkbox" checked><i style="--c:#d2a052"></i><span>MA10</span>
        </label>
        <label class="ma-toggle" data-period="20" title="MA20">
          <input type="checkbox" checked><i style="--c:#b8823f"></i><span>MA20</span>
        </label>
        <label class="ma-toggle" data-period="60" title="MA60">
          <input type="checkbox" checked><i style="--c:#8aa9a0"></i><span>MA60</span>
        </label>
        <label class="ma-toggle" data-period="120" title="MA120">
          <input type="checkbox"><i style="--c:#6d8fa3"></i><span>MA120</span>
        </label>
        <label class="ma-toggle" data-period="250" title="MA250">
          <input type="checkbox"><i style="--c:#5b7d94"></i><span>MA250</span>
        </label>
      </div>
    </div>

    <div id="chart" class="chart" role="img" aria-label="K线、成交量和 MACD，叠加均线、笔、线段、中枢与买卖点"></div>
    <div id="notice" class="notice" hidden></div>
  </main>

  <aside class="ledger" id="ledger">
    <div class="ledger-empty">输入代码后，这里列出该级别的线段、中枢与买卖点，以及每个结构的确认时间。</div>
  </aside>
</div>

<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
