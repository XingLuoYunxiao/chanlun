[project]
name = "chanlun"
version = "0.5.0"
description = "自主可控的缠论股票分析系统：baostock 数据层 + 纯函数增量结构引擎 + point-in-time 回测 + 扫描 + Web 看盘"
requires-python = ">=3.11"
dependencies = [
    "baostock",
    "pandas",
    "pyarrow",
    "duckdb",
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "pytdx",
    "tqdm",
]

[project.optional-dependencies]
# `httpx2` 是 `starlette.testclient` 的运行时依赖（`tests/web/` 用它起 ASGI 客户端），
# 但它**不在** starlette 的 install_requires 里：不装的话 `pytest` 连 `tests/web/`
# 都收集不了 —— `RuntimeError: The starlette.testclient module requires the httpx2
# package to be installed.`。starlette 1.7 的 `testclient.py` 优先 `import httpx2`，
# 退回 `httpx` 会发 `StarletteDeprecationWarning`，所以这里声明前者。
dev = ["pytest", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
# 默认不跑联网用例：它们依赖 baostock / 东财 / 腾讯，一轮要 8 分钟以上，
# 而「跑得快」是能天天跑、能天天信的前提。要跑真实网络用 `pytest -m live`。
addopts = "-m 'not live'"
markers = [
    "live: 需要真实网络（baostock / 东财 / 腾讯），默认跳过；显式 `pytest -m live` 运行",
]
